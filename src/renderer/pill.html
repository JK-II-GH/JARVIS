<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JARVIS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: transparent;
      overflow: hidden;
      -webkit-app-region: drag;
      user-select: none;
    }

    .pille {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 16px;
      height: 40px;
      background: rgba(20, 20, 20, 0.88);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      box-shadow:
        0 4px 24px rgba(0, 0, 0, 0.40),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      margin: 4px;
    }

    .indikator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 6px #4ade80;
      flex-shrink: 0;
      transition: background 0.2s, box-shadow 0.2s;
    }

    .indikator.aufnahme {
      background: #f87171;
      box-shadow: 0 0 8px #f87171;
      animation: pulsieren 0.6s ease-in-out infinite;
    }

    .indikator.verarbeitet {
      background: #facc15;
      box-shadow: 0 0 6px #facc15;
      animation: pulsieren 1s ease-in-out infinite;
    }

    @keyframes pulsieren {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    .status-text {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.85);
      letter-spacing: 0.01em;
    }

    .modus-badge {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      font-size: 11px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.45);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-left: auto;
    }
  </style>
</head>
<body>
  <div class="pille">
    <div class="indikator" id="indikator"></div>
    <span class="status-text" id="statusText">Bereit</span>
    <span class="modus-badge" id="modusBadge">Diktat</span>
  </div>

  <script>
    const indikator   = document.getElementById('indikator');
    const statusText  = document.getElementById('statusText');
    const modusBadge  = document.getElementById('modusBadge');

    let mediaRecorder = null;
    let audioChunks   = [];
    let mimeType      = 'audio/webm';

    const statusConfig = {
      bereit:       { text: 'Bereit',          klass: '' },
      aufnahme:     { text: 'Hört zu …',       klass: 'aufnahme' },
      verarbeitet:  { text: 'Verarbeitet …',   klass: 'verarbeitet' },
    };

    function setStatus(status, modus) {
      const cfg = statusConfig[status] || statusConfig.bereit;
      statusText.textContent  = cfg.text;
      indikator.className     = 'indikator ' + cfg.klass;
      if (modus) modusBadge.textContent = modus;
    }

    function bestAudioFormat() {
      const candidates = [
        'audio/webm;codecs=opus',
        'audio/webm',
        'audio/ogg;codecs=opus',
        'audio/mp4',
      ];
      return candidates.find(f => MediaRecorder.isTypeSupported(f)) || '';
    }

    // ── Aufnahme starten ────────────────────────────────────────────────────

    window.jarvis.onStartRecording(async () => {
      audioChunks = [];
      mimeType    = bestAudioFormat() || 'audio/webm';

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const opts   = mimeType ? { mimeType } : {};
        mediaRecorder = new MediaRecorder(stream, opts);

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.start(100);
      } catch (err) {
        console.error('JARVIS Renderer: Mikrofon-Fehler:', err);
        setStatus('bereit');
      }
    });

    // ── Aufnahme stoppen + Daten senden ────────────────────────────────────

    window.jarvis.onStopRecording(() => {
      if (!mediaRecorder || mediaRecorder.state === 'inactive') return;

      mediaRecorder.onstop = async () => {
        const blob  = new Blob(audioChunks, { type: mimeType });
        const ab    = await blob.arrayBuffer();
        window.jarvis.sendAudioData(ab, mimeType.split(';')[0]);

        // Mikrofon-Stream freigeben
        mediaRecorder.stream.getTracks().forEach(t => t.stop());
        mediaRecorder = null;
        audioChunks   = [];
      };

      mediaRecorder.stop();
    });

    // ── Status-Updates vom Main-Prozess ────────────────────────────────────

    window.jarvis.onStatusUpdate((status, modus) => setStatus(status, modus));
  </script>
</body>
</html>
