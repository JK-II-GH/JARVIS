<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JARVIS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: transparent;
      overflow: hidden;
      user-select: none;
    }

    .pille {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 16px;
      height: 40px;
      background: rgba(20, 20, 20, 0.88);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      box-shadow:
        0 4px 24px rgba(0, 0, 0, 0.40),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      margin: 4px;
      /* Pille ist ziehbar, außer beim Modus-Badge */
      -webkit-app-region: drag;
    }

    .indikator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 6px #4ade80;
      flex-shrink: 0;
      transition: background 0.2s, box-shadow 0.2s;
    }

    .indikator.aufnahme {
      background: #f87171;
      box-shadow: 0 0 8px #f87171;
      animation: pulsieren 0.6s ease-in-out infinite;
    }

    .indikator.verarbeitet {
      background: #facc15;
      box-shadow: 0 0 6px #facc15;
      animation: pulsieren 1s ease-in-out infinite;
    }

    .indikator.spricht {
      background: #818cf8;
      box-shadow: 0 0 8px #818cf8;
      animation: pulsieren 0.8s ease-in-out infinite;
    }

    @keyframes pulsieren {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    .status-text {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.85);
      letter-spacing: 0.01em;
    }

    .modus-badge {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      font-size: 11px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.45);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-left: auto;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
      /* Klicks durchlassen, kein Drag */
      -webkit-app-region: no-drag;
      transition: background 0.15s, color 0.15s;
    }

    .modus-badge:hover {
      background: rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.75);
    }

    .modus-badge.aktiv {
      background: rgba(99, 179, 237, 0.25);
      color: rgba(147, 210, 255, 0.9);
    }

    .modus-badge.gespraech {
      background: rgba(251, 146, 60, 0.22);
      color: rgba(253, 186, 116, 0.95);
    }

    .modus-badge.datei {
      background: rgba(52, 211, 153, 0.2);
      color: rgba(110, 231, 183, 0.9);
    }

    .settings-btn {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.25);
      cursor: pointer;
      -webkit-app-region: no-drag;
      padding: 2px 4px;
      border-radius: 4px;
      transition: color 0.15s;
      line-height: 1;
    }

    .settings-btn:hover {
      color: rgba(255, 255, 255, 0.6);
    }
  </style>
</head>
<body>
  <div class="pille">
    <div class="indikator" id="indikator"></div>
    <span class="status-text" id="statusText">Bereit</span>
    <span class="modus-badge" id="modusBadge" title="Klicken zum Wechseln">Diktat</span>
    <span class="settings-btn" id="settingsBtn" title="Einstellungen">⚙</span>
  </div>

  <script>
    const indikator   = document.getElementById('indikator');
    const statusText  = document.getElementById('statusText');
    const modusBadge  = document.getElementById('modusBadge');

    const MODI = ['Diktat', 'Bearbeiten', 'Gespräch', 'Datei'];
    const MODI_VALUES = ['dictation', 'edit', 'conversation', 'file'];
    let modusIndex = 0;
    let aufnahmeAktiv = false;

    // ── Modus-Umschalter ────────────────────────────────────────────────────

    function applyModus(index) {
      modusIndex = index;
      modusBadge.textContent = MODI[modusIndex];
      modusBadge.classList.toggle('aktiv',     modusIndex === 1);
      modusBadge.classList.toggle('gespraech', modusIndex === 2);
      modusBadge.classList.toggle('datei',     modusIndex === 3);
      window.jarvis.setMode(MODI_VALUES[modusIndex]);
    }

    modusBadge.addEventListener('click', () => {
      if (aufnahmeAktiv) return;
      applyModus((modusIndex + 1) % MODI.length);
    });

    document.getElementById('settingsBtn').addEventListener('click', () => {
      window.jarvis.openSettings();
    });

    // Doppeltipp vom Main-Prozess
    window.jarvis.onModeUpdate((mode) => {
      const idx = MODI_VALUES.indexOf(mode);
      if (idx !== -1) applyModus(idx);
    });

    // ── Status ──────────────────────────────────────────────────────────────

    const statusConfig = {
      bereit:       { text: 'Bereit',          klass: '' },
      aufnahme:     { text: 'Hoert zu ...',    klass: 'aufnahme' },
      verarbeitet:  { text: 'Verarbeitet ...', klass: 'verarbeitet' },
      spricht:      { text: 'Spricht ...',     klass: 'spricht' },
    };

    function setStatus(status, modus) {
      const cfg = statusConfig[status] || statusConfig.bereit;
      statusText.textContent = cfg.text;
      indikator.className    = 'indikator ' + cfg.klass;
      aufnahmeAktiv = (status !== 'bereit');
      if (modus) modusBadge.textContent = modus;
    }

    // ── WAV-Encoder: Float32 PCM → 16-bit Mono WAV ─────────────────────────

    function encodeWav(samples, sampleRate) {
      const buf  = new ArrayBuffer(44 + samples.length * 2);
      const view = new DataView(buf);
      const str  = (off, s) => [...s].forEach((c, i) => view.setUint8(off + i, c.charCodeAt(0)));

      str(0, 'RIFF'); view.setUint32(4, 36 + samples.length * 2, true);
      str(8, 'WAVE'); str(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);           // PCM
      view.setUint16(22, 1, true);           // Mono
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      str(36, 'data'); view.setUint32(40, samples.length * 2, true);

      let off = 44;
      for (const s of samples) {
        const v = Math.max(-1, Math.min(1, s));
        view.setInt16(off, v < 0 ? v * 32768 : v * 32767, true);
        off += 2;
      }
      return buf;
    }

    // ── Aufnahme ────────────────────────────────────────────────────────────

    let audioCtx  = null;
    let micStream = null;
    let processor = null;
    let pcmChunks = [];

    window.jarvis.onStartRecording(async () => {
      // Im Datei-Modus Fensterquellen aus dem Renderer-Kontext holen
      // (ScreenCaptureKit-Berechtigung wird hier korrekt ausgelöst)
      if (MODI_VALUES[modusIndex] === 'file') {
        try {
          const sources = await window.jarvis.getWindowSources();
          window.jarvis.sendWindowSources(sources);
          console.log('JARVIS Renderer: Fensterquellen:', sources.map(s => s.name).join(', '));
        } catch (e) {
          window.jarvis.sendWindowSources([]);
        }
      }

      pcmChunks = [];
      try {
        // Nativen Sample-Rate verwenden — erzwungene 16 kHz werden von macOS
        // ignoriert und führen zu falschem WAV-Header → Whisper-Halluzinationen
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true }
        });
        audioCtx  = new AudioContext();
        const src = audioCtx.createMediaStreamSource(micStream);
        processor = audioCtx.createScriptProcessor(4096, 1, 1);

        processor.onaudioprocess = (e) =>
          pcmChunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));

        src.connect(processor);
        processor.connect(audioCtx.destination);
      } catch (err) {
        console.error('JARVIS Renderer: Mikrofon-Fehler:', err);
        setStatus('bereit');
      }
    });

    window.jarvis.onStopRecording(() => {
      if (!processor) return;

      const nativeSampleRate = audioCtx.sampleRate;
      processor.disconnect();
      micStream.getTracks().forEach(t => t.stop());
      audioCtx.close();
      processor = null;

      const totalLen = pcmChunks.reduce((n, c) => n + c.length, 0);
      // Mindestens ~0,3 s bei nativem Sample-Rate
      if (totalLen < nativeSampleRate * 0.3) return;

      const pcm = new Float32Array(totalLen);
      let off = 0;
      for (const c of pcmChunks) { pcm.set(c, off); off += c.length; }
      pcmChunks = [];

      // Nativen Sample-Rate korrekt in WAV-Header schreiben
      window.jarvis.sendAudioData(encodeWav(pcm, nativeSampleRate), 'audio/wav');
    });

    // ── IPC vom Main-Prozess ────────────────────────────────────────────────

    window.jarvis.onStatusUpdate((status, modus) => setStatus(status, modus));
  </script>
</body>
</html>
