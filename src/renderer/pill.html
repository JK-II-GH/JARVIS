<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JARVIS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: transparent;
      overflow: hidden;
      -webkit-app-region: drag;
      user-select: none;
    }

    .pille {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 16px;
      height: 40px;
      background: rgba(20, 20, 20, 0.88);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      box-shadow:
        0 4px 24px rgba(0, 0, 0, 0.40),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      margin: 4px;
    }

    .indikator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 6px #4ade80;
      flex-shrink: 0;
      transition: background 0.2s, box-shadow 0.2s;
    }

    .indikator.aufnahme {
      background: #f87171;
      box-shadow: 0 0 8px #f87171;
      animation: pulsieren 0.6s ease-in-out infinite;
    }

    .indikator.verarbeitet {
      background: #facc15;
      box-shadow: 0 0 6px #facc15;
      animation: pulsieren 1s ease-in-out infinite;
    }

    @keyframes pulsieren {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    .status-text {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.85);
      letter-spacing: 0.01em;
    }

    .modus-badge {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      font-size: 11px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.45);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-left: auto;
    }
  </style>
</head>
<body>
  <div class="pille">
    <div class="indikator" id="indikator"></div>
    <span class="status-text" id="statusText">Bereit</span>
    <span class="modus-badge" id="modusBadge">Diktat</span>
  </div>

  <script>
    const indikator   = document.getElementById('indikator');
    const statusText  = document.getElementById('statusText');
    const modusBadge  = document.getElementById('modusBadge');

    // Aufnahme-Zustand (Web Audio API → WAV, kein MediaRecorder-Codec nötig)
    let audioCtx   = null;
    let micStream  = null;
    let processor  = null;
    let pcmChunks  = [];

    const statusConfig = {
      bereit:       { text: 'Bereit',          klass: '' },
      aufnahme:     { text: 'Hört zu …',       klass: 'aufnahme' },
      verarbeitet:  { text: 'Verarbeitet …',   klass: 'verarbeitet' },
    };

    function setStatus(status, modus) {
      const cfg = statusConfig[status] || statusConfig.bereit;
      statusText.textContent  = cfg.text;
      indikator.className     = 'indikator ' + cfg.klass;
      if (modus) modusBadge.textContent = modus;
    }

    // WAV-Encoder: Float32 PCM → WAV ArrayBuffer (16-bit Mono)
    function encodeWav(samples, sampleRate) {
      const buf  = new ArrayBuffer(44 + samples.length * 2);
      const view = new DataView(buf);
      const str  = (off, s) => [...s].forEach((c, i) => view.setUint8(off + i, c.charCodeAt(0)));

      str(0, 'RIFF'); view.setUint32(4, 36 + samples.length * 2, true);
      str(8, 'WAVE'); str(12, 'fmt ');
      view.setUint32(16, 16, true);           // fmt-Chunk-Größe
      view.setUint16(20, 1, true);            // PCM
      view.setUint16(22, 1, true);            // Mono
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);           // 16 Bit
      str(36, 'data'); view.setUint32(40, samples.length * 2, true);

      let off = 44;
      for (const s of samples) {
        const v = Math.max(-1, Math.min(1, s));
        view.setInt16(off, v < 0 ? v * 32768 : v * 32767, true);
        off += 2;
      }
      return buf;
    }

    // ── Aufnahme starten ────────────────────────────────────────────────────

    window.jarvis.onStartRecording(async () => {
      pcmChunks = [];
      try {
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: { sampleRate: 16000, channelCount: 1, echoCancellation: true, noiseSuppression: true }
        });
        audioCtx  = new AudioContext({ sampleRate: 16000 });
        const src = audioCtx.createMediaStreamSource(micStream);
        processor = audioCtx.createScriptProcessor(4096, 1, 1);

        processor.onaudioprocess = (e) =>
          pcmChunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));

        src.connect(processor);
        processor.connect(audioCtx.destination);
      } catch (err) {
        console.error('JARVIS Renderer: Mikrofon-Fehler:', err);
        setStatus('bereit');
      }
    });

    // ── Aufnahme stoppen + WAV senden ──────────────────────────────────────

    window.jarvis.onStopRecording(() => {
      if (!processor) return;

      processor.disconnect();
      micStream.getTracks().forEach(t => t.stop());
      audioCtx.close();
      processor = null;

      const totalLen = pcmChunks.reduce((n, c) => n + c.length, 0);
      if (totalLen < 4800) return; // weniger als 0,3 s → überspringen

      const pcm = new Float32Array(totalLen);
      let off = 0;
      for (const c of pcmChunks) { pcm.set(c, off); off += c.length; }
      pcmChunks = [];

      window.jarvis.sendAudioData(encodeWav(pcm, 16000), 'audio/wav');
    });

    // ── Status-Updates vom Main-Prozess ────────────────────────────────────

    window.jarvis.onStatusUpdate((status, modus) => setStatus(status, modus));
  </script>
</body>
</html>
