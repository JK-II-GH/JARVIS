<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JARVIS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: transparent;
      overflow: hidden;
      user-select: none;
      /* Pille horizontal mittig im Fenster halten — Fenster ist breiter
         als die Pille, damit diese atmen kann */
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .pille {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 16px;
      height: 40px;
      background: rgba(20, 20, 20, 0.88);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      box-shadow:
        0 4px 24px rgba(0, 0, 0, 0.40),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      margin: 4px;
      /* Pille ist ziehbar, außer beim Modus-Badge / Settings-Button */
      -webkit-app-region: drag;
      /* Sanftes Wachsen/Schrumpfen, wenn der Status-Text wechselt */
      transition: width 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: width, transform;
    }

    /* Kurzes "Atmen" bei jedem Zustandswechsel */
    .pille.tick { animation: pillTick 0.32s cubic-bezier(0.4, 0, 0.2, 1); }
    @keyframes pillTick {
      0%   { transform: scale(1);    }
      45%  { transform: scale(0.965);}
      100% { transform: scale(1);    }
    }

    .indikator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 6px #4ade80;
      flex-shrink: 0;
      transition: background 0.2s, box-shadow 0.2s, opacity 0.2s;
    }

    /* Bei Aufnahme: Punkt verschwindet, Audio-Pegel-Balken kommen */
    .indikator.aufnahme { display: none; }

    .indikator.verarbeitet {
      background: #facc15;
      box-shadow: 0 0 6px #facc15;
      animation: pulsieren 1s ease-in-out infinite;
    }

    .indikator.spricht {
      background: #818cf8;
      box-shadow: 0 0 8px #818cf8;
      animation: pulsieren 0.8s ease-in-out infinite;
    }

    @keyframes pulsieren {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    /* Audio-Pegel-Anzeige (drei Balken) während Aufnahme */
    .pegel {
      display: none;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
      height: 14px;
    }
    .pegel.aktiv { display: inline-flex; }
    .pegel .bar {
      width: 3px;
      height: 4px;
      background: #f87171;
      box-shadow: 0 0 4px rgba(248, 113, 113, 0.6);
      border-radius: 1.5px;
      transition: height 0.06s linear;
    }

    .status-text {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.85);
      letter-spacing: 0.01em;
    }

    .modus-badge {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      font-size: 11px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.45);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-left: auto;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
      /* Klicks durchlassen, kein Drag */
      -webkit-app-region: no-drag;
      transition: background 0.15s, color 0.15s;
    }

    .modus-badge:hover {
      background: rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.75);
    }

    .modus-badge.aktiv {
      background: rgba(99, 179, 237, 0.25);
      color: rgba(147, 210, 255, 0.9);
    }

    .modus-badge.gespraech {
      background: rgba(251, 146, 60, 0.22);
      color: rgba(253, 186, 116, 0.95);
    }

    .modus-badge.datei {
      background: rgba(52, 211, 153, 0.2);
      color: rgba(110, 231, 183, 0.9);
    }

    .settings-btn {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.25);
      cursor: pointer;
      -webkit-app-region: no-drag;
      padding: 2px 4px;
      border-radius: 4px;
      transition: color 0.15s;
      line-height: 1;
    }

    .settings-btn:hover {
      color: rgba(255, 255, 255, 0.6);
    }
  </style>
</head>
<body>
  <div class="pille" id="pille">
    <div class="indikator" id="indikator"></div>
    <div class="pegel" id="pegel">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>
    <span class="status-text" id="statusText">Bereit</span>
    <span class="modus-badge" id="modusBadge" title="Klicken zum Wechseln">Diktat</span>
    <span class="settings-btn" id="settingsBtn" title="Einstellungen">⚙</span>
  </div>

  <script>
    const pille       = document.getElementById('pille');
    const indikator   = document.getElementById('indikator');
    const pegel       = document.getElementById('pegel');
    const pegelBars   = pegel.querySelectorAll('.bar');
    const statusText  = document.getElementById('statusText');
    const modusBadge  = document.getElementById('modusBadge');

    // Mode-IDs + Labels kommen jetzt aus dem Preload (Single-Source-of-Truth
    // mit src/platform/index.ts), damit eine Änderung dort sofort durchschlägt.
    const MODI_VALUES = window.jarvis.modes;
    const MODI        = MODI_VALUES.map(m => window.jarvis.modeLabels[m]);
    let modusIndex = 0;
    let aufnahmeAktiv = false;

    // ── Modus-Umschalter ────────────────────────────────────────────────────

    function applyModus(index, { fromMain = false } = {}) {
      modusIndex = index;
      modusBadge.textContent = MODI[modusIndex];
      modusBadge.classList.toggle('aktiv',     modusIndex === 1);
      modusBadge.classList.toggle('gespraech', modusIndex === 2);
      modusBadge.classList.toggle('datei',     modusIndex === 3);
      // Nicht zurückspiegeln, wenn der Wechsel vom Main kam — sonst
      // pingt das Mode-Update zwischen Main und Renderer hin und her
      if (!fromMain) window.jarvis.setMode(MODI_VALUES[modusIndex]);
      // Badge-Text wechselt die Breite (z.B. "Diktat" vs "Bearbeiten") —
      // die Pille muss sich mit anpassen, sonst wird das Zahnrad abgeschnitten
      animatePillResize();
    }

    modusBadge.addEventListener('click', () => {
      if (aufnahmeAktiv) return;
      applyModus((modusIndex + 1) % MODI.length);
    });

    document.getElementById('settingsBtn').addEventListener('click', () => {
      window.jarvis.openSettings();
    });

    // Mode-Update vom Main (Doppeltipp oder Tray-Klick) — kein setMode
    // zurückschicken, sonst pingt der Wechsel als Roundtrip
    window.jarvis.onModeUpdate((mode) => {
      const idx = MODI_VALUES.indexOf(mode);
      if (idx !== -1) applyModus(idx, { fromMain: true });
    });

    // ── Status ──────────────────────────────────────────────────────────────

    const statusConfig = {
      bereit:       { text: 'Bereit',          klass: '' },
      aufnahme:     { text: 'Hoert zu ...',    klass: 'aufnahme' },
      verarbeitet:  { text: 'Verarbeitet ...', klass: 'verarbeitet' },
      spricht:      { text: 'Spricht ...',     klass: 'spricht' },
    };

    function setStatus(status, modus) {
      const cfg = statusConfig[status] || statusConfig.bereit;
      statusText.textContent = cfg.text;
      indikator.className    = 'indikator ' + cfg.klass;
      pegel.classList.toggle('aktiv', status === 'aufnahme');
      aufnahmeAktiv = (status !== 'bereit');
      if (modus) modusBadge.textContent = modus;
      animatePillResize();
      tickPulse();
    }

    // Pille passt ihre Breite an den Inhalt an — wir messen die natürliche
    // Content-Breite und setzen sie explizit, damit die CSS-Transition greift
    function animatePillResize() {
      // Erst auf "auto" für ehrliche Messung, dann auf gemessene Pixel
      pille.style.width = 'auto';
      requestAnimationFrame(() => {
        const w = pille.scrollWidth;
        pille.style.width = w + 'px';
      });
    }

    // Re-trigger eine einmalige Tick-Animation
    function tickPulse() {
      pille.classList.remove('tick');
      void pille.offsetWidth;
      pille.classList.add('tick');
    }

    // Initiale Breite setzen, sobald DOM gemalt ist
    requestAnimationFrame(animatePillResize);

    // ── WAV-Encoder: Float32 PCM → 16-bit Mono WAV ─────────────────────────

    function encodeWav(samples, sampleRate) {
      const buf  = new ArrayBuffer(44 + samples.length * 2);
      const view = new DataView(buf);
      const str  = (off, s) => [...s].forEach((c, i) => view.setUint8(off + i, c.charCodeAt(0)));

      str(0, 'RIFF'); view.setUint32(4, 36 + samples.length * 2, true);
      str(8, 'WAVE'); str(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);           // PCM
      view.setUint16(22, 1, true);           // Mono
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      str(36, 'data'); view.setUint32(40, samples.length * 2, true);

      let off = 44;
      for (const s of samples) {
        const v = Math.max(-1, Math.min(1, s));
        view.setInt16(off, v < 0 ? v * 32768 : v * 32767, true);
        off += 2;
      }
      return buf;
    }

    // ── Aufnahme ────────────────────────────────────────────────────────────

    let audioCtx  = null;
    let micStream = null;
    let processor = null;
    let analyser  = null;
    let pegelRaf  = null;
    let pcmChunks = [];
    // Generations-Zähler: erhöht sich bei jedem onStartRecording + onCancel.
    // Wenn ein verspätet aufgelöstes getUserMedia-Promise nicht mehr zum
    // aktiven Aufnahme-Versuch gehört, schließen wir den Stream sofort
    // (verhindert "stummen Mic", der orange Dot bleibt sonst hängen).
    let recordingGeneration = 0;
    let recordingActive = false;

    window.jarvis.onStartRecording(async () => {
      const myGen = ++recordingGeneration;
      recordingActive = true;

      // Im Datei-Modus Fensterquellen aus dem Renderer-Kontext holen
      // (ScreenCaptureKit-Berechtigung wird hier korrekt ausgelöst)
      if (MODI_VALUES[modusIndex] === 'file') {
        try {
          const sources = await window.jarvis.getWindowSources();
          window.jarvis.sendWindowSources(sources);
          console.log('JARVIS Renderer: Fensterquellen:', sources.map(s => s.name).join(', '));
        } catch (e) {
          window.jarvis.sendWindowSources([]);
        }
      }

      pcmChunks = [];
      let stream;
      try {
        // Nativen Sample-Rate verwenden — erzwungene 16 kHz werden von macOS
        // ignoriert und führen zu falschem WAV-Header → Whisper-Halluzinationen
        stream = await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true }
        });
      } catch (err) {
        console.error('JARVIS Renderer: Mikrofon-Fehler:', err);
        recordingActive = false;
        window.jarvis.sendRecordingFailed('mic-denied');
        return;
      }

      // Während getUserMedia pending war, könnte ein Cancel passiert sein.
      // Dann sind wir nicht mehr die "aktive" Generation → Stream sofort
      // schließen, sonst bleibt das Mikro offen.
      if (myGen !== recordingGeneration || !recordingActive) {
        stream.getTracks().forEach(t => t.stop());
        return;
      }

      try {
        micStream = stream;
        audioCtx  = new AudioContext();
        const src = audioCtx.createMediaStreamSource(micStream);
        processor = audioCtx.createScriptProcessor(4096, 1, 1);

        processor.onaudioprocess = (e) =>
          pcmChunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));

        src.connect(processor);
        processor.connect(audioCtx.destination);

        // Parallel-Pfad für die Pegel-Visualisierung — AnalyserNode greift
        // unabhängig vom ScriptProcessor auf den Stream zu
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 512;
        analyser.smoothingTimeConstant = 0.6;
        src.connect(analyser);
        startPegelLoop();
      } catch (err) {
        console.error('JARVIS Renderer: Audio-Setup fehlgeschlagen:', err);
        recordingActive = false;
        teardownMic();
        window.jarvis.sendRecordingFailed('audio-setup-failed');
      }
    });

    // Pegel-Anzeige: AnalyserNode → RMS → drei Balken-Höhen.
    // Verschiedene Frequenzbänder, damit die Balken nicht alle gleich zucken.
    function startPegelLoop() {
      stopPegelLoop();
      const buf = new Uint8Array(analyser.frequencyBinCount);
      const bandRanges = [
        [0, Math.floor(buf.length * 0.10)],       // Bässe
        [Math.floor(buf.length * 0.10), Math.floor(buf.length * 0.40)], // Mitten
        [Math.floor(buf.length * 0.40), Math.floor(buf.length * 0.80)], // Höhen
      ];
      const smoothed = [0, 0, 0];
      const minH = 4, maxH = 14;
      const step = () => {
        if (!analyser) return;
        analyser.getByteFrequencyData(buf);
        for (let i = 0; i < 3; i++) {
          const [a, b] = bandRanges[i];
          let sum = 0;
          for (let j = a; j < b; j++) sum += buf[j];
          const avg = sum / Math.max(1, b - a) / 255; // 0..1
          // Exponentielle Glättung — weniger Geflacker
          smoothed[i] = smoothed[i] * 0.55 + avg * 0.45;
          // leichte Nichtlinearität für mehr Sprache-Sichtbarkeit
          const h = minH + Math.pow(Math.min(1, smoothed[i] * 1.6), 0.7) * (maxH - minH);
          pegelBars[i].style.height = h.toFixed(1) + 'px';
        }
        pegelRaf = requestAnimationFrame(step);
      };
      pegelRaf = requestAnimationFrame(step);
    }

    function stopPegelLoop() {
      if (pegelRaf) cancelAnimationFrame(pegelRaf);
      pegelRaf = null;
      for (const b of pegelBars) b.style.height = '4px';
    }

    function teardownMic() {
      stopPegelLoop();
      if (!processor) return;
      try { processor.disconnect(); } catch {}
      try { analyser && analyser.disconnect(); } catch {}
      try { micStream && micStream.getTracks().forEach(t => t.stop()); } catch {}
      try { audioCtx && audioCtx.close(); } catch {}
      processor = null;
      analyser  = null;
      micStream = null;
      audioCtx  = null;
    }

    window.jarvis.onStopRecording(() => {
      recordingActive = false;
      if (!processor) {
        // Aufnahme wurde nie aufgebaut (z.B. getUserMedia hat zu lange
        // gedauert oder schlug fehl) — Main muss aus "verarbeitet" raus
        window.jarvis.sendRecordingFailed('no-audio');
        return;
      }

      const nativeSampleRate = audioCtx.sampleRate;
      const totalLen = pcmChunks.reduce((n, c) => n + c.length, 0);

      teardownMic();

      // Mindestens ~0,3 s bei nativem Sample-Rate — sonst kein sinnvolles
      // Audio. Main muss trotzdem aus "verarbeitet" raus.
      if (totalLen < nativeSampleRate * 0.3) {
        pcmChunks = [];
        window.jarvis.sendRecordingFailed('too-short');
        return;
      }

      const pcm = new Float32Array(totalLen);
      let off = 0;
      for (const c of pcmChunks) { pcm.set(c, off); off += c.length; }
      pcmChunks = [];

      // Nativen Sample-Rate korrekt in WAV-Header schreiben
      window.jarvis.sendAudioData(encodeWav(pcm, nativeSampleRate), 'audio/wav');
    });

    // Tap (vor Hold-Threshold losgelassen) — vorbereitete Aufnahme verwerfen.
    // Generation hochzählen, damit ein noch laufendes getUserMedia-Promise
    // nicht doch noch einen Stream aufmacht.
    window.jarvis.onCancelRecording(() => {
      recordingActive = false;
      recordingGeneration++;
      teardownMic();
      pcmChunks = [];
    });

    // ── IPC vom Main-Prozess ────────────────────────────────────────────────

    window.jarvis.onStatusUpdate((status, modus) => setStatus(status, modus));
  </script>
</body>
</html>
