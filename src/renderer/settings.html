<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>JARVIS — Einstellungen</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      font-size: 13px;
      background: #1c1c1e;
      color: rgba(255,255,255,0.85);
      padding: 18px;
    }

    h1 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #fff;
    }

    .section {
      background: rgba(255,255,255,0.06);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: rgba(255,255,255,0.4);
      margin-bottom: 10px;
    }

    .field {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .field:last-child { margin-bottom: 0; }

    label {
      width: 140px;
      flex-shrink: 0;
      color: rgba(255,255,255,0.7);
    }

    input[type="text"], input[type="password"], select {
      flex: 1;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px;
      padding: 6px 10px;
      color: rgba(255,255,255,0.9);
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus, select:focus {
      border-color: rgba(99,179,237,0.6);
    }

    .input-wrap {
      flex: 1;
      position: relative;
      display: flex;
    }

    .input-wrap input {
      flex: 1;
      padding-right: 32px;
    }

    .eye-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      padding: 2px;
      cursor: pointer;
      color: rgba(255,255,255,0.3);
      font-size: 14px;
      line-height: 1;
      transition: color 0.15s;
      user-select: none;
    }

    .eye-btn:hover { color: rgba(255,255,255,0.65); }

    .clear-btn {
      position: absolute;
      right: 30px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      padding: 2px;
      cursor: pointer;
      color: rgba(255,255,255,0.3);
      font-size: 13px;
      line-height: 1;
      transition: color 0.15s;
      user-select: none;
    }

    .clear-btn:hover { color: rgba(248,113,113,0.8); }

    .input-wrap input {
      padding-right: 54px;
    }

    select option { background: #2c2c2e; }

    .hint {
      font-size: 11px;
      color: rgba(255,255,255,0.3);
      margin-top: 2px;
      margin-bottom: 4px;
      margin-left: 152px;
    }

    .hint a {
      color: rgba(99,179,237,0.7);
      text-decoration: none;
      cursor: pointer;
    }

    .hint a:hover {
      color: rgba(99,179,237,1);
      text-decoration: underline;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 14px;
    }

    button {
      padding: 7px 18px;
      border-radius: 7px;
      border: none;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    button:hover { opacity: 0.85; }

    .btn-cancel {
      background: rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.8);
    }

    .btn-save {
      background: #0a84ff;
      color: #fff;
    }
  </style>
</head>
<body>
  <h1>JARVIS — Einstellungen</h1>

  <div class="section">
    <div class="section-title">KI-Anbieter</div>
    <div class="field">
      <label>Anbieter</label>
      <select id="aiProvider">
        <option value="anthropic">Anthropic (Claude)</option>
        <option value="openai">OpenAI (GPT-4o)</option>
      </select>
    </div>
    <div class="field">
      <label>Anthropic API-Key</label>
      <div class="input-wrap">
        <input type="password" id="anthropicKey" placeholder="sk-ant-..." autocomplete="off" />
        <button class="clear-btn" data-target="anthropicKey" tabindex="-1" title="Löschen">✕</button>
        <button class="eye-btn" data-target="anthropicKey" tabindex="-1" title="Anzeigen">👁</button>
      </div>
    </div>
    <div class="hint"><a href="#" data-url="https://console.anthropic.com/settings/keys">console.anthropic.com/settings/keys</a></div>
    <div class="field">
      <label>OpenAI API-Key</label>
      <div class="input-wrap">
        <input type="password" id="openaiKey" placeholder="sk-..." autocomplete="off" />
        <button class="clear-btn" data-target="openaiKey" tabindex="-1" title="Löschen">✕</button>
        <button class="eye-btn" data-target="openaiKey" tabindex="-1" title="Anzeigen">👁</button>
      </div>
    </div>
    <div class="hint"><a href="#" data-url="https://platform.openai.com/api-keys">platform.openai.com/api-keys</a></div>
  </div>

  <div class="section">
    <div class="section-title">Spracherkennung (STT)</div>
    <div class="field">
      <label>Groq API-Key</label>
      <div class="input-wrap">
        <input type="password" id="groqKey" placeholder="gsk_..." autocomplete="off" />
        <button class="clear-btn" data-target="groqKey" tabindex="-1" title="Löschen">✕</button>
        <button class="eye-btn" data-target="groqKey" tabindex="-1" title="Anzeigen">👁</button>
      </div>
    </div>
    <div class="hint"><a href="#" data-url="https://console.groq.com/keys">console.groq.com/keys</a> — kostenlos</div>
  </div>

  <div class="section">
    <div class="section-title">Hotkey</div>
    <div class="field">
      <label>Tastenkombination</label>
      <select id="hotkey">
        <option value="cmd+alt">⌘ + ⌥  (Cmd + Option)</option>
        <option value="cmd+ctrl">⌘ + ⌃  (Cmd + Control)</option>
        <option value="cmd+shift">⌘ + ⇧  (Cmd + Shift)</option>
        <option value="ctrl+alt">⌃ + ⌥  (Control + Option)</option>
        <option value="ctrl+shift">⌃ + ⇧  (Control + Shift)</option>
        <option value="alt+shift">⌥ + ⇧  (Option + Shift)</option>
      </select>
    </div>
    <div class="hint">Halten zum Sprechen, Doppeltipp wechselt den Modus.</div>
  </div>

  <div class="actions">
    <button class="btn-cancel" id="btnCancel">Abbrechen</button>
    <button class="btn-save" id="btnSave">Speichern</button>
  </div>

  <script>
    const api = window.jarvisSettings;

    // Felder laden
    api.load().then((s) => {
      document.getElementById('aiProvider').value   = s.aiProvider    || 'anthropic';
      document.getElementById('anthropicKey').value = s.anthropicKey  || '';
      document.getElementById('openaiKey').value    = s.openaiKey     || '';
      document.getElementById('groqKey').value      = s.groqKey       || '';
      document.getElementById('hotkey').value       = s.hotkey        || 'cmd+alt';
    });

    // Inhalt vermessen → Hauptprozess passt das Fenster automatisch an.
    // Wir warten auf den ersten Paint, damit Font-Metriken und Boxhöhen
    // korrekt sind.
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        const h = Math.ceil(document.body.getBoundingClientRect().height);
        api.fitWindow(h);
      });
    });

    document.getElementById('btnSave').addEventListener('click', async () => {
      await api.save({
        aiProvider:   document.getElementById('aiProvider').value,
        anthropicKey: document.getElementById('anthropicKey').value.trim(),
        openaiKey:    document.getElementById('openaiKey').value.trim(),
        groqKey:      document.getElementById('groqKey').value.trim(),
        hotkey:       document.getElementById('hotkey').value,
      });
      api.close();
    });

    document.getElementById('btnCancel').addEventListener('click', () => {
      api.close();
    });

    document.querySelectorAll('a[data-url]').forEach((a) => {
      a.addEventListener('click', (e) => {
        e.preventDefault();
        api.openExternal(a.getAttribute('data-url'));
      });
    });

    document.querySelectorAll('.clear-btn').forEach((btn) => {
      const input = document.getElementById(btn.getAttribute('data-target'));
      btn.addEventListener('click', () => { input.value = ''; input.focus(); });
    });

    document.querySelectorAll('.eye-btn').forEach((btn) => {
      const input = document.getElementById(btn.getAttribute('data-target'));
      btn.addEventListener('mousedown', (e) => {
        e.preventDefault();
        input.type = 'text';
      });
      btn.addEventListener('mouseup',   () => { input.type = 'password'; });
      btn.addEventListener('mouseleave', () => { input.type = 'password'; });
    });
  </script>
</body>
</html>
